# Publish to PyPI using trusted publishing (OIDC) — no API token required.
#
# The trusted publisher registered on PyPI matches on the exact workflow
# filename, so DO NOT rename this file without updating PyPI to match:
#
#   Owner:            sinndevelopment
#   Repository:       inventree-plugin-explosives
#   Workflow:         publish.yml
#   Environment:      pypi
#
# The `pypi` environment must also exist under repository Settings > Environments;
# protection rules on it (e.g. required reviewers) gate every release.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nothing is built or published unless the full suite passes against a real
  # InvenTree. The numbers this plugin reports are compliance numbers.
  tests:
    name: Full test suite
    uses: ./.github/workflows/test.yaml

  build:
    name: Build distribution
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The wheel must contain the built panels. Without this the package installs
      # cleanly and then every UI panel silently fails to render.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Fail if the frontend bundle is missing
        run: |
          for entry in Panel LocationPanel Dashboard Settings; do
            if [ ! -f "inventree_explosives/static/$entry.js" ]; then
              echo "::error::inventree_explosives/static/$entry.js was not built"
              exit 1
            fi
          done

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      # Guard against shipping a wheel whose static/ is empty despite the build
      # step above (e.g. a MANIFEST.in or packaging regression).
      - name: Fail if the wheel does not contain the panels
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()

          missing = [
              f"inventree_explosives/static/{entry}.js"
              for entry in ("Panel", "LocationPanel", "Dashboard", "Settings")
              if f"inventree_explosives/static/{entry}.js" not in names
          ]

          if missing:
              sys.exit(f"::error::{wheel} is missing: {', '.join(missing)}")

          print(f"{wheel} contains all panel entrypoints")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/inventree-plugin-explosives

    permissions:
      # Required for trusted publishing: mints the short-lived OIDC token that
      # PyPI exchanges for an upload token. No PYPI_API_TOKEN secret is used.
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
