name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v5

  version:
    name: Tag matches PLUGIN_VERSION
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compare tag with PLUGIN_VERSION
        id: check
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            tag="$RELEASE_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            echo "::error::A manual publish must run on a tag, not the $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
            exit 1
          fi

          version="$(python -c 'from inventree_explosives import PLUGIN_VERSION; print(PLUGIN_VERSION)')"

          if [ "${tag#v}" != "$version" ]; then
            echo "::error file=inventree_explosives/__init__.py::Tag $tag does not match PLUGIN_VERSION $version"
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag is $(git rev-parse HEAD), but this run is for $GITHUB_SHA. Republish it with a manual run on the tag."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version from $tag"

  tests:
    name: Full test suite
    needs: version
    uses: ./.github/workflows/test.yaml

  build:
    name: Build distribution
    needs: [version, tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Fail if the frontend bundle is missing
        run: |
          for entry in PartPanel LocationPanel Dashboard Settings; do
            if [ ! -f "inventree_explosives/static/$entry.js" ]; then
              echo "::error::inventree_explosives/static/$entry.js was not built"
              exit 1
            fi
          done

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Fail if the wheel does not contain the panels
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()

          missing = [
              f"inventree_explosives/static/{entry}.js"
              for entry in ("PartPanel", "LocationPanel", "Dashboard", "Settings")
              if f"inventree_explosives/static/{entry}.js" not in names
          ]

          if missing:
              sys.exit(f"::error::{wheel} is missing: {', '.join(missing)}")

          print(f"{wheel} contains all panel entrypoints")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/inventree-plugin-explosives

    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
